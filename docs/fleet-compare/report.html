<title>Đội tàu cứu hộ VEDC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; a table of numbers, small charts, then a map per scenario in a grid */
:root{
  --bg:#f6f8f9; --panel:#ffffff; --ink:#10202b; --ink-2:#4a5b66; --ink-3:#7a8a94; --line:#dbe3e8; --water:#e3eef3; --house:#c9d2d8;
  --accent:#0e7490;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --person:#e34948; --good:#15803d; --warn:#b45309;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1419; --panel:#121d24; --ink:#e6eef2; --ink-2:#a8b8c2; --ink-3:#7f919c; --line:#22323c; --water:#132630; --house:#2c3c46;
  --accent:#22d3ee; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --person:#e66767; --good:#4ade80; --warn:#fbbf24; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c1419; --panel:#121d24; --ink:#e6eef2; --ink-2:#a8b8c2; --ink-3:#7f919c; --line:#22323c; --water:#132630; --house:#2c3c46;
  --accent:#22d3ee; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --person:#e66767; --good:#4ade80; --warn:#fbbf24; color-scheme:dark }
body{ background:var(--bg); color:var(--ink); font:15px/1.6 var(--sans); }
main{ max-width:1080px; margin:0 auto; padding-block:28px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:grid; gap:28px; }
h1{ font-size:clamp(24px, 4vw, 32px); line-height:1.2; margin:0; text-wrap:balance; letter-spacing:-.01em; }
h2{ font-size:19px; margin:0 0 10px; text-wrap:balance; }
p{ margin:0; max-width:70ch; }
.lead{ color:var(--ink-2); }
.eyebrow{ font:600 12px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
header{ display:grid; gap:10px; }
section{ display:grid; gap:12px; min-width:0; }
.findings{ display:grid; gap:10px; margin:0; padding:0; list-style:none; }
.findings li{ padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
.findings b{ color:var(--ink); }
.tbl{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
table{ border-collapse:collapse; width:100%; min-width:760px; font-size:14px; }
th,td{ padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
th:first-child,td:first-child{ text-align:left; }
thead th{ font-weight:600; color:var(--ink-2); font-size:12.5px; }
tbody tr:last-child td{ border-bottom:0; }
td{ font-variant-numeric:tabular-nums; }
td small{ color:var(--ink-3); }
.charts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; }
.chart{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:8px; min-width:0; }
.chart h3{ margin:0; font-size:14px; }
.chart p{ font-size:12.5px; color:var(--ink-3); }
.bars{ display:grid; gap:6px; }
.bar{ display:grid; grid-template-columns:minmax(110px, 38%) 1fr auto; align-items:center; gap:8px; font-size:13px; }
.bar span:first-child{ color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track{ height:14px; background:var(--water); border-radius:3px; position:relative; }
.fill{ position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:0 4px 4px 0; }
.bar b{ font:600 13px var(--mono); min-width:5ch; text-align:right; }
.maps{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; }
.map{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; gap:6px; min-width:0; }
.map h3{ margin:0; font-size:14px; }
.map svg{ width:100%; height:auto; display:block; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink-2); }
.legend i{ display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
.legend i.dot{ width:9px; height:9px; border-radius:50%; }
.note{ font-size:13px; color:var(--ink-3); }
code{ font:13px var(--mono); }
</style>

<main>
  <header>
    <span class="eyebrow">VEDC 2026 · Chung kết · Vấn đề 1</span>
    <h1>Một trạm bờ, ba tàu: chia vùng hay đi đội hình?</h1>
    <p class="lead" id="lead"></p>
  </header>

  <section>
    <h2>Kết luận</h2>
    <ul class="findings" id="findings"></ul>
  </section>

  <section>
    <h2>Số liệu từng kịch bản</h2>
    <div class="tbl"><table id="tbl"></table></div>
    <p class="note" id="method"></p>
  </section>

  <section>
    <h2>So sánh nhanh</h2>
    <div class="charts" id="charts"></div>
  </section>

  <section>
    <h2>Đường đi của từng tàu</h2>
    <div class="legend" id="maplegend"></div>
    <div class="maps" id="maps"></div>
  </section>
</main>

const TEXT = {"lead": "Tám lượt chạy mô phỏng đầy đủ (Gazebo + firmware STM32 + Pi + camera phát hiện người cho từng tàu, chung một kênh LoRa có mô hình va chạm) trên hai cảnh, mỗi cảnh 8 người gặp nạn: một vùng nước ngập rộng 60 × 36 m, và một con phố ngập dài 78 m, rộng 11 m. Câu hỏi: trạm bờ nên giao việc cho ba tàu bằng cách chia vùng, đi đội hình theo tàu dẫn đầu, hay một tàu là đủ.", "method": "Mỗi kịch bản chạy một lần, 15 phút từ lúc gửi kế hoạch (riêng 'không chia khe' 5 phút), mỗi tàu dừng tối đa 20 s bên một người rồi đi tiếp. Vùng rộng: làn quét cách nhau 8 m, đội hình hàng ngang cách nhau 6 m. Phố: chia vùng quét ngang phố, đội hình cách nhau 4 m. 'Diện tích đã nhìn': phần vùng nằm trong 6 m quanh đường đi. 'Năng lượng': tổng ga × thời gian (đơn vị tương đối). 'LoRa mất': khung trạm không nhận được do trùng khung hoặc đang phát. Mỗi kịch bản chỉ chạy một lần nên chênh lệch nhỏ chưa có ý nghĩa thống kê.", "findings": ["<b>Vùng rộng: ba tàu chia vùng tìm hết 8/8 người sau 570 s; một tàu sau 15 phút vẫn sót 1 người.</b> Chia vùng thấy một nửa số người sau 240 s (một tàu: 289 s), mỗi tàu chỉ chạy 74–147 m, chỉ 2 lần báo trùng và 54 s ở gần nhau dưới 3 m.", "<b>Vùng rộng: đội hình cũng tìm hết 8/8 nhưng chậm hơn (714 s) và tốn gần gấp rưỡi năng lượng</b> (89,5 so với 60,7). Nhìn kỹ nhất (99,3% diện tích) nhưng 7 người bị nhiều tàu cùng báo, 9 lần báo trùng, 126 s các tàu sát nhau. Giữ hàng tốt hơn ở phố (lệch trung vị 5,7 m so với 9 m).", "<b>Chia khe thời gian (TDMA) là bắt buộc.</b> Không chia khe: 216 khung bị mất, trạm chỉ nghe PHAO-01 13 lần trong 5 phút, lộ trình giao chậm nên cả ba tàu chỉ đi được 37,5 m và tìm thấy 1 người. Có chia khe: mỗi tàu được nghe đều đặn mỗi 8 s, mất khoảng 8–11% ở cả hai cảnh.", "<b>Phố hẹp: ba tàu chưa hơn một tàu.</b> Một tàu: 6/8 người; ba tàu chia vùng hay đội hình: 4/8. Phố chỉ rộng 11 m nên một camera đã quét gần hết bề ngang; ba tàu chen nhau, và chia vùng buộc phải quét ngang phố với nhiều lần quay đầu.", "<b>Nhiều tàu cùng dừng bên một người là chỗ tốn nhất (vấn đề 2).</b> Đội hình báo trùng 9 lần ở cả hai cảnh; mỗi lần cả đội mất 20 s. Đây là số liệu đầu vào cho cơ chế nhận nạn nhân: một tàu ở lại, các tàu khác đi tiếp.", "<b>Mất tàu dẫn đầu không làm hỏng nhiệm vụ.</b> Tắt PHAO-01 ở giây 200 (phố): sau 30 s im lặng, trạm bầu PHAO-02 làm dẫn đầu và giao phần lộ trình còn lại; hai tàu còn lại vẫn tìm thấy 5/8 người và nhìn 96,7% diện tích.", "<b>Đề xuất:</b> mặc định chia vùng cho vùng ngập rộng (nhanh nhất, ít tốn nhất); đội hình khi cần nhìn kỹ một dải hẹp hoặc cần các tàu hỗ trợ nhau; phố hẹp hơn hai lần tầm camera thì một tàu là đủ, các tàu còn lại nên sang phố khác. Bắt buộc chia khe LoRa. Việc tiếp theo có lợi nhất là cơ chế nhận nạn nhân (vấn đề 2)."]};

// Table
const cols = [
  ["Kịch bản", r => name(r)],
  ["Người tìm thấy", r => `${r.found}/${r.people}`],

];
$("tbl").innerHTML = `<thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${
  DATA.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody>`;

// Bar charts: one measure each, every scenario on the same scale
function barChart(title, note, value, unit, better) {
  const vals = DATA.map(r => ({ r, v: value(r) })).filter(x => x.v !== null && x.v !== undefined);
  const max = Math.max(...vals.map(x => x.v), 1);
  const el = document.createElement("div"); el.className = "chart";
  el.innerHTML = `<h3>${title}</h3><p>${note}</p><div class="bars">${vals.map(({ r, v }) =>
    `<div class="bar" title="${name(r)}: ${v}${unit}"><span>${name(r)}</span><span class="track"><span class="fill" style="width:${Math.max(1, 100 * v / max)}%"></span></span><b>${v}${unit}</b></div>`).join("")}</div>`;
  $("charts").appendChild(el);
}
barChart("Số người tìm thấy", "Trong cả lượt chạy; nhiều hơn là tốt hơn", r => r.found, ` / ${DATA[0] ? DATA[0].people : ""}`);
barChart("Thời gian thấy một nửa số người", "Từ lúc gửi kế hoạch; ngắn hơn là tốt hơn", r => r.time_half_s, " s");
barChart("Diện tích đã nằm trong tầm camera", "Trong cả lượt chạy; cao hơn là tốt hơn", r => r.seen_pct, "%");
barChart("Số lần báo trùng một người", "Nhiều tàu cùng báo một người: tốn tài nguyên (vấn đề 2)", r => r.repeat_reports, "");
barChart("Tổng quãng đường cả đội", "Cả đội cộng lại", r => r.distance_m, " m");

// Maps: the search area of each run (r.area_xy) with a margin; the street of the central scene also gets its houses
const BOATS = ["PHAO-01", "PHAO-02", "PHAO-03"], COLORS = ["var(--s1)", "var(--s2)", "var(--s3)"];
$("maplegend").innerHTML = BOATS.map((b, i) => `<span><i style="background:${COLORS[i]}"></i>${b}</span>`).join("") +
  `<span><i class="dot" style="background:var(--person)"></i>Người gặp nạn</span><span><i class="dot" style="background:none;border:2px solid var(--ink)"></i>Tàu báo thấy người</span>`;
const STREET = [[-2, -5.5], [76, -5.5], [76, 5.5], [-2, 5.5]];
for (const r of DATA) {
  const area = r.area_xy || STREET, street = (r.world || "central") === "central";
  const ax = area.map(p => p[0]), ay = area.map(p => p[1]);
  const X0 = Math.min(...ax) - 4, X1 = Math.max(...ax) + 4, Y0 = street ? -10 : Math.min(...ay) - 4, Y1 = street ? 10 : Math.max(...ay) + 4;
  const W = 860, H = Math.round(W * (Y1 - Y0) / (X1 - X0)), sx = x => (x - X0) / (X1 - X0) * W, sy = y => (Y1 - y) / (Y1 - Y0) * H;
  const el = document.createElement("div"); el.className = "map";
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Đường đi: ${name(r)}">`;
  svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--water)" rx="6"/>`;
  // The two rows of houses along the street, their fronts about 7 m either side of the middle
  if (street) for (const [top, bottom] of [[10, 7], [-7, -10]]) svg += `<rect x="${sx(4)}" y="${sy(top)}" width="${sx(76) - sx(4)}" height="${sy(bottom) - sy(top)}" fill="var(--house)"/>`;
  svg += `<polygon points="${area.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1"/>`;
  BOATS.forEach((b, i) => {
    const pts = (r.tracks[b] || []).map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(" ");
    if (pts) svg += `<polyline points="${pts}" fill="none" stroke="${COLORS[i]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  for (const [, x, y] of r.victims_xy) svg += `<circle cx="${sx(x)}" cy="${sy(y)}" r="5" fill="var(--person)" stroke="var(--panel)" stroke-width="2"/>`;
  BOATS.forEach((b, i) => { for (const [x, y] of r.reports_xy[b] || []) svg += `<circle cx="${sx(x)}" cy="${sy(y)}" r="7" fill="none" stroke="${COLORS[i]}" stroke-width="2"/>`; });
  svg += `</svg>`;
  el.innerHTML = `<h3>${name(r)}</h3>${svg}<p class="note">${r.found}/${r.people} người · ${r.seen_pct}% diện tích · ${r.repeat_reports} lần báo trùng</p>`;
  $("maps").appendChild(el);
}
</script>
