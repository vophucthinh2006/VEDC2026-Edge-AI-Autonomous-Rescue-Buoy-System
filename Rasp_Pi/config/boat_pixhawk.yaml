# The Pixhawk boat (Raspberry Pi + Pixhawk + STM32F103), on top of settings.yaml.
# run.sh pixhawk adds this file by itself; the simulator uses sim.yaml instead.
lidar:
  source: serial              # the LD14 on serial.lidar_port
serial:
  # The LD14 on its own USB-to-TTL adapter (socket usb-0:1.3), same reasoning as helper.port.
  # It needs only its TX wired to the adapter's RXD (and 5 V, GND): it spins and streams on power.
  lidar_port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3:1.0-port0
helper:
  # The STM32F103 on its USB-to-TTL adapter; it drives the camera servo. By USB socket, not
  # /dev/ttyUSBn: the boat's CP2102 adapters have no serial number and ttyUSBn swaps between boots.
  # Keep the adapter in the same socket (usb-0:1.1); after re-plugging, tools/port_probe.py names the new one.
  port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1:1.0-port0
mavlink:
  # TELEM2 on its own USB-to-TTL adapter (socket usb-0:1.4), same reasoning as helper.port.
  # The baud stays settings.yaml's 921600, which pixhawk/params/boat.parm sets (SERIAL2_BAUD 921);
  # an autopilot still at the default 115 is only heard with mavlink.baud: 115200.
  url: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4:1.0-port0
camera:
  # The Suyin USB camera by its serial number: /dev/video0, 1, ... change with the plugging order.
  device: /dev/v4l/by-id/usb-Suyin_HD_Camera_200910120001-video-index0
  # Only without the helper board (helper.port: none): camera servo on one of the autopilot's
  # outputs instead, driven with DO_SET_SERVO. 0: no servo, the camera stays ahead.
  pan_output: 0
  pan_center_us: 1500
  pan_us_per_deg: 5.5         # 1000..2000 us over about 180 deg (SG90)
  pan_dir: -1                 # flip if the camera turns away from the person
