# The STM32F407 boat (Raspberry Pi + STM32F407), on top of settings.yaml.
# run.sh stm32 adds this file by itself. Put here what only this boat needs, so the Pixhawk
# boat's values stay untouched.
serial:
  # The STM32F407's UART4 on a USB-to-TTL adapter in socket usb-0:1.2 (the Pi 4 8 GB, 2026-10-18):
  # by socket, not /dev/ttyUSBn, which swaps between boots. tools/port_probe.py names it after re-plugging.
  stm32_port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-port0
  # Socket usb-0:1.3 is the camera's: on the Pi 4 8 GB the webcam (480 Mbit/s) enumerates and streams
  # only there; in 1.1, 1.2 and 1.4 it connects and drops again (error -71), while the 12 Mbit/s
  # adapters and an ESP32 run fine in those. Checked 2026-10-18 with clean power and the new EEPROM.
  # The LD14 on its USB-to-TTL adapter in socket usb-0:1.1, by socket, not /dev/ttyUSBn, which swaps
  # between boots. tools/port_probe.py names it after re-plugging.
  lidar_port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1:1.0-port0
vehicle:
  # A swimming pool: arrive within the GPS's wander (2 to 3 m) of a waypoint. 0.30 m/s (30 % throttle)
  # proved too slow on the water (2026-11-04): up to the F407's 50 % throttle cap (App/control.c).
  max_speed_mps: 0.50
  approach_speed_mps: 0.25
  face_speed_mps: 0.17
  arrive_radius_m: 3.0
  # The competition room has no GPS fix: with a route the boat still drives, along its bow, the
  # LiDAR avoiding (modules/navigation.py bow_no_gps). Put true back for the water: there a lost
  # fix must stop it (gps_stale_or_no_fix).
  gps_required: false
# No RC transmitter: the boat runs only a route sent from the dashboard ("Gửi tới phao"), and an
# empty route stops it (docs/lora-route-downlink.md). Until one arrives, and once it is done, the
# boat stays still: mission_stm32.yaml gives the pool's geofence only.
mission:
  waypoints_from_file: false
follow:
  only_on_route: true
# The phone over Bluetooth: V manual, v auto (modules/bt_manual.py).
manual:
  enabled: true
camera:
  # The camera by its id: /dev/video0, 1, ... change with the plugging order. The Rapoo C270L on the
  # pan servo (2026-10-20), which sweeps and follows as the Suyin did; the Suyin was
  # /dev/v4l/by-id/usb-Suyin_HD_Camera_200910120001-video-index0. Another camera plugged in needs its
  # id here: with a wrong one the detector never gets a frame (2026-11-17, a Generic Web Camera is
  # /dev/v4l/by-id/usb-Generic_Web_Camera_20250708V1.000-video-index0).
  device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._rapoo_camera_SN0001-video-index0
  pan_limit_deg: 45           # following a person, too: the servo stays within +-45 deg
  scan:
    sweep_limit_deg: 45       # the search sweep (in every state but IDLE, modules/mission.py): +-45 deg
    sweep_rate_deg_s: 15      # at about 1 detector frame a second, 30 deg/s moved half the 60 deg view
                              # between frames: a spot was seen in 2 frames, blurred; 15: in 4, 12 s a round
    # Pan-tilt gimbal (2 SG90): the water at tilt 0, the roofs at 20, a row each way: 12 s a round.
    # 30 was tried in the simulator: with the camera 0.33 m above the water that row was mostly sky.
    mode: raster
    tilt_rows_deg: [0, 20]
  tilt_enabled: true          # $CAM,seq,pan,tilt; the tilt follows the person too (settings.yaml tilt_*)
