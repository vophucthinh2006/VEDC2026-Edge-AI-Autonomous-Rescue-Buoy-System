# On top of sim.yaml: the STM32F407 boat (main.py) in the simulator (sim/tools/stm32_central_test.sh).
# The F407 and the LD14 are stand-ins behind pseudo-terminals (sim/tools/f407_board_sim.py,
# ld14_emulator.py); the launcher writes their paths into a second overlay:
#   serial: {stm32_port: ..., lidar_port: ...}
serial:
  lidar_model: ld14
vehicle:
  # The emulated LD14 has its zero at the bow and the Gazebo LiDAR does not see the hull:
  # none of the bench calibration of settings.yaml applies.
  lidar_yaw_offset_deg: 0.0
  lidar_mask: []
  # Before the front motor braked (App/front_motor.c) the boat coasted about 1 m past the stand-off;
  # 3 m was set for that and is kept: braking now leaves it nearer 3 m than 2 m from the person.
  target_standoff_m: 3.0
mission:
  file: config/mission_sim_central.yaml
  waypoints_from_file: true   # the test drives the file's route, not one from the dashboard
audio:
  device: default
