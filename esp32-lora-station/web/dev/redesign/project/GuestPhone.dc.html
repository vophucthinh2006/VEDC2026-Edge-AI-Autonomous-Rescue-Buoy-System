<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Theo dõi cứu hộ lũ – điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7490}a:hover{color:#155E75}
.btn-reset{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes breathe{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.32;transform:scale(1.08)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F7F9; color: #0F172A; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px">
  <header style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <span style="width: 32px; height: 32px; border-radius: 9px; background: #E0F2F7; color: #0E7490; display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>
    </span>
    <b style="flex: 1; font-size: 15px">Theo dõi cứu hộ lũ</b>
    <span role="status" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: #DCFCE7; color: #15803D; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 999px; background: #15803D"></span>Trực tiếp</span>
  </header>

  <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <section aria-label="Quê nhà" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 14px rgba(15,23,42,.06)">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 28px; height: 28px; border-radius: 999px; background: #EDE9FE; color: #7C3AED; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"></path></svg></span>
        <b style="flex: 1; font-size: 16px">Hòa Châu, Hòa Vang</b>
        <button class="btn-reset" type="button" style="height: 40px; padding: 0 8px; color: #0E7490; font-weight: 700">Đổi</button>
        <button class="btn-reset" type="button" aria-label="Gửi cho người nhà" style="width: 40px; height: 40px; border-radius: 10px; background: #E0F2F7; color: #0E7490; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: #FEF2F2">
        <svg width="64" height="64" viewBox="0 0 88 88" role="img" aria-label="Có người nguy kịch" style="flex: none"><circle class="breathe" cx="44" cy="44" r="40" style="fill: #DC2626"></circle><circle cx="44" cy="44" r="30" style="fill: #fff; stroke: #DC2626; stroke-width: 4"></circle><path d="M44 32l13 24H31z" style="fill: none; stroke: #DC2626; stroke-width: 3; stroke-linejoin: round"></path><path d="M44 41v6M44 51v.5" style="stroke: #DC2626; stroke-width: 3; stroke-linecap: round"></path></svg>
        <div><b style="font-size: 18px; color: #B91C1C">Có người nguy kịch</b><br><span style="color: #475569; font-size: 13px">trong 5 km quanh nhà</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 10px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px"><b style="font-size: 24px">3</b><span style="font-size: 12px; color: #475569; line-height: 1.3">phao<br>gần nhà</span></div>
        <div style="padding: 10px; border-radius: 12px; background: #FFF7ED; border: 1px solid #FED7AA; display: flex; align-items: center; gap: 10px"><b style="font-size: 24px; color: #C2410C">3</b><span style="font-size: 12px; color: #475569; line-height: 1.3">được<br>phát hiện</span></div>
        <div style="padding: 10px; border-radius: 12px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; gap: 10px"><b style="font-size: 24px; color: #15803D">1</b><span style="font-size: 12px; color: #475569; line-height: 1.3">nhận<br>cứu trợ</span></div>
        <div style="padding: 10px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px"><b style="font-size: 24px">1,2</b><span style="font-size: 12px; color: #475569; line-height: 1.3">km phao gần<br>Đông Nam</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 10px; border-radius: 12px; border: 1px solid #E2E8F0"><span style="font-size: 12px; color: #475569">Mưa 24 giờ</span><br><b style="font-size: 20px">48</b><span style="font-size: 12px; color: #64748B"> mm · 97%</span></div>
        <div style="padding: 10px; border-radius: 12px; border: 1px solid #FECACA; background: #FFFBFB"><span style="font-size: 12px; color: #475569">Sông Cẩm Lệ</span><br><b style="font-size: 20px">2,1</b><span style="font-size: 12px; color: #64748B"> m </span><span style="padding: 0 5px; border-radius: 4px; background: #B91C1C; color: #fff; font-size: 10px; font-weight: 800">BĐ2</span></div>
      </div>
    </section>

    <!-- map -->
    <div style="position: relative; height: 230px; border-radius: 18px; overflow: hidden; border: 1px solid #E2E8F0">
      <svg width="366" height="230" viewBox="0 0 366 230" style="position: absolute; inset: 0" aria-hidden="true">
        <rect width="366" height="230" style="fill: #E9EEF3"></rect>
        <path d="M366 30 C 280 70 240 60 190 110 C 140 160 100 170 0 210" style="fill: none; stroke: #A7C8E4; stroke-width: 30; stroke-linecap: round"></path>
        <path d="M0 120 L 366 90 M 120 0 L 150 230" style="stroke: #fff; stroke-width: 3"></path>
        <circle cx="170" cy="120" r="90" style="fill: rgba(124,58,237,.06); stroke: #7C3AED; stroke-width: 1.5; stroke-dasharray: 6 6"></circle>
        <circle cx="130" cy="80" r="7" style="fill: #DC2626; stroke: #fff; stroke-width: 2"></circle>
        <circle cx="220" cy="95" r="7" style="fill: #EA580C; stroke: #fff; stroke-width: 2"></circle>
        <circle cx="140" cy="95" r="8" style="fill: #fff; stroke: #15803D; stroke-width: 4"></circle>
        <circle cx="250" cy="70" r="8" style="fill: #fff; stroke: #15803D; stroke-width: 4"></circle>
        <path d="M170 104a10 10 0 0 0-10 10c0 7 10 17 10 17s10-10 10-17a10 10 0 0 0-10-10z" style="fill: #7C3AED; stroke: #fff; stroke-width: 2"></path>
      </svg>
      <span style="position: absolute; left: 8px; bottom: 8px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.92); display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600"><span style="width: 9px; height: 9px; border-radius: 999px; background: #7C3AED"></span>Nhà bạn · 5 km</span>
    </div>

    <section aria-label="Người được phát hiện gần nhà" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 10px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px">
        <span style="width: 14px; height: 14px; border-radius: 999px; background: #DC2626; box-shadow: 0 0 0 4px rgba(220,38,38,.18)"></span>
        <span style="flex: 1"><b>Nguy kịch</b><br><span style="font-size: 12px; color: #475569">1,1 km · 3 phút</span></span>
        <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">Phao đang tới</span>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
